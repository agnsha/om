[package]
name = "omc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
om-codegen = { version = "0.1.0", path = "../om-codegen" }
om-lexer = { version = "0.1.0", path = "../om-lexer" }
om-parser = { version = "0.1.0", path = "../om-parser" }

[[bin]]
name = "om"
path = "src/main.rs"

# Finds the Microsoft C compiler (cl.exe) and its INCLUDE/LIB paths on Windows.
[target.'cfg(windows)'.dependencies]
cc = "1"
