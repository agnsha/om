name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Run examples
        shell: bash
        run: |
          for f in examples/*.om; do
            echo "== $f"
            cargo run -q --bin om -- run "$f"
          done

  # On Windows, also check the commands a beginner types in PowerShell.
  windows-powershell:
    name: Windows PowerShell install and run
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install om and run programs from PowerShell
        shell: powershell
        run: |
          cargo install --path crates/omc
          if ($LASTEXITCODE -ne 0) { exit 1 }
          om --version
          om run examples/hello.om
          if ($LASTEXITCODE -ne 0) { exit 1 }
          om build examples/fib.om -o fib.exe
          .\fib.exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # The game reads keys from stdin when it is not a console: start a seeded game and quit.
          $out = "s42`nllllckaom`n`nQyxq" | om run games/hollow-bell/hollow_bell.om | Out-String
          if ($out -notmatch "Depth 1/6") { Write-Output $out; exit 1 }
          Write-Output "The Hollow Bell runs on Windows"
